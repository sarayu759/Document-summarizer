services:
  - type: web
    name: document-summarizer
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      apt-get update
      apt-get install -y tesseract-ocr
      echo "TESSERACT PATH:"
      which tesseract || echo "NOT FOUND"
    startCommand: streamlit run app.py --server.port 10000 --server.address 0.0.0.0